<!DOCTYPE html>
<html>
<head>
  <title>Railway Robot App</title>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body{
      margin:0;
      padding:0;
      background:#0f172a;
      font-family:Arial;
      color:white;
    }

    .app{
      max-width:350px;
      margin:30px auto;
      background:#111827;
      border-radius:25px;
      padding:20px;
      box-shadow:0 0 20px rgba(0,0,0,0.5);
    }

    .top{
      text-align:center;
      margin-bottom:30px;
    }

    .robot{
      font-size:70px;
    }

    h1{
      font-size:28px;
    }

    .status{
      background:#1e293b;
      padding:15px;
      border-radius:15px;
      margin-bottom:20px;
      text-align:center;
      font-size:20px;
    }

    button{
      width:100%;
      padding:15px;
      border:none;
      border-radius:15px;
      background:#06b6d4;
      color:white;
      font-size:18px;
    }
  </style>
</head>

<body>

<div class="app">

  <div class="top">
    <div class="robot">🤖</div>
    <h1>Railway Robot</h1>
  </div>

  <div class="status" id="status">
    System Ready ✅
  </div>

  <button onclick="runRobot()">
    Start Robot
  </button>

</div>

<script>
function runRobot(){
  document.getElementById("status").innerHTML =
  "Railway Track Safe 🚆";
}
</script>
<br><br>

<button onclick="trainStatus()">
🚆 Train Status
</button>

<br><br>

<button onclick="dangerAlert()">
⚠️ Danger Alert
</button>

<script>

function trainStatus(){
document.getElementById("status").innerHTML =
"Train Running On Time ✅";
}

function dangerAlert(){
document.getElementById("status").innerHTML =
"Obstacle Detected ⚠️";
}

</script>
</body>
  </html>
